<!DOCTYPE html>
<html>
<head>
  <title>Deforestation Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h2>Sensor Data (Last 50 entries)</h2>
  <canvas id="chart" width="800" height="400"></canvas>

  <script>
    const labels = {{ records|map(attribute='timestamp')|list }};
    const temps = {{ records|map(attribute='temperature')|list }};
    const hums = {{ records|map(attribute='humidity')|list }};
    const air = {{ records|map(attribute='air_quality')|list }};

    const ctx = document.getElementById('chart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Temperature (°C)',
            data: temps,
            borderColor: 'red',
            fill: false
          },
          {
            label: 'Humidity (%)',
            data: hums,
            borderColor: 'blue',
            fill: false
          },
          {
            label: 'Air Quality',
            data: air,
            borderColor: 'green',
            fill: false
          }
        ]
      },
      options: {
        responsive: true,
        scales: {
          x: { title: { display: true, text: 'Timestamp' } },
          y: { beginAtZero: true }
        }
      }
    });
  </script>
</body>
</html>
